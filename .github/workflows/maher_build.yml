name: Maher APK Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      # ✅ إصلاح: إكمال مشروع أندرويد الناقص (مجلد android/ والأذونات)
      - name: Complete missing Android project files
        run: flutter create . --platforms android --org com.maher --project-name $(grep '^name:' pubspec.yaml | awk '{print $2}')
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maher-build-${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
